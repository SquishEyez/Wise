# Publishes the hub to GitHub Pages on every push to main.
# Address: https://squisheyez.github.io/Wise/ (set in app/.env.production; the
# Android app hands signing over to wallets at that address).
name: Publish hub
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: npm ci
      - run: npm --workspace app run build
        env:
          # Free key from blockfrost.io (Mainnet project) saved as a repo secret named BLOCKFROST_KEY.
          # Needed because Koios mainnet answers are blocked inside browsers.
          VITE_BLOCKFROST_KEY: ${{ secrets.BLOCKFROST_KEY }}
      - name: Warn if the site has no data provider
        env: { KEY: "${{ secrets.BLOCKFROST_KEY }}" }
        run: '[ -n "$KEY" ] || echo "::warning::No BLOCKFROST_KEY secret, so the published hub cannot read the chain in browsers."' 
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
