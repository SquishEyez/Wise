# Rescue mission: scan the chain for every contract holding Working Dead assets.
# Runs on demand and whenever the scanner changes. Results are committed to the
# `chain-data` branch (rescue/scan/out/), so every scan is kept and diffable.
name: Chain scan
on:
  workflow_dispatch:
    inputs:
      job: { description: "vaults | holders | both | live", default: "vaults" }
  push:
    branches: [main]
    paths: ["rescue/scan/**"]
permissions: { contents: write }
concurrency: { group: chain-scan, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --prefix rescue/scan --no-audit --no-fund
      - name: Live check (app's Rescue scan on real stakers)
        if: ${{ github.event_name == 'push' || inputs.job == 'live' }}
        run: npm ci --no-audit --no-fund && npx tsx rescue/scan/live-check.mts
      - name: Vault rebuild
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.job == 'vaults' || inputs.job == 'both') }}
        run: node rescue/scan/vaults.mjs
      - name: Holder / contract scan
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.job == 'holders' || inputs.job == 'both') }}
        run: node rescue/scan/scan.mjs
      - name: Commit results to chain-data branch
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.job != 'live' }}
        run: |
          set -e
          cp -r rescue/scan/out /tmp/out
          git config user.name "chain-scan bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin chain-data:chain-data 2>/dev/null && git switch chain-data || git switch --orphan chain-data
          rm -rf .github rescue app android shared offchain onchain scripts 2>/dev/null || true
          cp -r /tmp/out/* .
          git add -A
          git commit -qm "scan $(date -u +%FT%TZ) from ${GITHUB_SHA::7}" || echo "nothing new"
          git push origin chain-data
