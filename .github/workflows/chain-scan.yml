# Rescue mission: scan the chain for every contract holding Working Dead assets.
# Runs on demand and whenever the scanner changes; results are kept as an artifact.
name: Chain scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["rescue/scan/**"]
permissions: { contents: read }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node rescue/scan/scan.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: chain-scan, path: rescue/scan/out/ }
